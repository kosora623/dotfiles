# ~/.config/mise/config.toml  (global tools)
# プロジェクトごとのバージョンは各リポジトリの mise.toml / .node-version / .nvmrc に書く

[tools]
node = "lts"
# latest にしないのは、メジャーが上がったときに勝手に切り替わらないようにするため
go = "1.27"
# グローバルの Python には何も入れない。ツールは uv tool、プロジェクトは uv venv
python = "3.13"

# 今は winget で入れていて、mise への移行を保留しているもの（手順は notes/mise-migration.md）。
# 移すときはコメントを外して mise install し、winget 側をアンインストールする
# java = "25"   # shorthand の vendor は temurin（"25" = Temurin 25）。Oracle にするなら "oracle-25"
# bun = "latest"

[settings]
# .node-version / .nvmrc / .python-version も読む
idiomatic_version_file_enable_tools = ["node", "python"]
