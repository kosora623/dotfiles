# 1行プロンプトでシンプル・高速に
# 色はターミナルのカラースキームに合わせて変わる名前付きカラーだけを使う
add_newline = true

format = """
$directory\
$git_branch\
$git_status\
$character"""

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[directory]
style = "bold blue"
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = " "
style = "bold purple"

[git_status]
style = "bold yellow"
