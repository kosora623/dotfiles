# 1行プロンプトでシンプル・高速に
# 色はターミナルのカラースキームに合わせて変わる名前付きカラーだけを使う
add_newline = true

format = """
$directory\
${env_var.GIT_BRANCH}\
$character"""

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[directory]
style = "bold blue"
truncation_length = 3
# true だと starship がリポジトリを開いて 90ms 以上かかるので false
truncate_to_repo = false

# git はブランチ名だけ表示する（速度優先。状態は git status / lazygit で見る）。
# starship の git_branch / git_status は使わず、PowerShell プロファイルの
# Invoke-Starship-PreCommand が .git/HEAD を読んで STARSHIP_GIT_BRANCH に入れる
[env_var.GIT_BRANCH]
variable = "STARSHIP_GIT_BRANCH"
style = "bold purple"
format = "on [ $env_value]($style) "
